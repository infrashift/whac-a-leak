<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Whac-a-Leak">
  <rect width="64" height="64" rx="14" fill="#1a1510"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="11" fill="none" stroke="#e8a72c" stroke-opacity="0.5" stroke-width="2"/>
  <!-- key, lying flat -->
  <circle cx="18" cy="45" r="6.5" fill="none" stroke="#f0b93a" stroke-width="3.5"/>
  <path d="M24.5 45 H50 M43 45 V51 M48 45 V50" fill="none" stroke="#f0b93a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- mallet, mid-swing -->
  <g transform="rotate(-28 40 22)">
    <rect x="27" y="10" width="26" height="12" rx="3.5" fill="#b9793b" stroke="#e7e2d6" stroke-width="2"/>
    <path d="M27 13 V19 M53 13 V19" stroke="#6b4423" stroke-width="2"/>
    <path d="M40 22 V36" stroke="#e7e2d6" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- impact -->
  <path d="M33 33 l-3 -3 M37 31 l0 -4 M29 37 l-4 0" stroke="#ef5b4f" stroke-width="2.2" stroke-linecap="round"/>
</svg>
